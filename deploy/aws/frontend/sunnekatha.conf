server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://sunnekatha.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunnekatha.com www.sunnekatha.com api.sunnekatha.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sunnekatha.com;

    ssl_certificate /etc/letsencrypt/live/sunnekatha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnekatha.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sunnekatha.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.sunnekatha.com;

    ssl_certificate /etc/letsencrypt/live/sunnekatha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnekatha.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    server_tokens off;

    # Staff audio uploads are validated by Django up to 500 MiB. Keep the
    # public API limit small while allowing multipart overhead in Admin.
    location ^~ /admin/ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name sunnekatha.com;

    ssl_certificate /etc/letsencrypt/live/sunnekatha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnekatha.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
