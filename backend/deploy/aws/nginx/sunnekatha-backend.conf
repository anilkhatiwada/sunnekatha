server {
    listen 80;
    listen [::]:80;
    server_name 13.205.30.123;

    client_max_body_size 2m;
    server_tokens off;

    # Serve immutable admin/application assets without occupying a Gunicorn
    # worker. The shared directory contains collected static files only; Nginx
    # never receives access to application releases or environment secrets.
    location ^~ /static/ {
        root /var/www/sunnekatha;
        access_log off;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Staff audio uploads are validated by Django up to 500 MiB. Keep the
    # public API limit small while allowing multipart overhead in Admin.
    location ^~ /admin/ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
