services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sunnekatha
      POSTGRES_USER: sunnekatha
      POSTGRES_PASSWORD: sunnekatha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunnekatha -d sunnekatha"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: local-compose-only-secret
      DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgresql://sunnekatha:sunnekatha@db:5432/sunnekatha
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: web
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: migrate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    environment: *backend-environment
    command: worker
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
    environment: *backend-environment
    command: beat
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
